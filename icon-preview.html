<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuvuzela 아이콘 후보</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #fefaf0;
    color: #0f172a;
    padding: 24px 16px 40px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.5;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #fbbf24, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  p.sub { color: #64748b; font-size: 15px; font-weight: 500; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .item {
    background: #ffffff;
    padding: 24px;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.04);
    text-align: center;
    transition: transform 0.15s;
  }
  .item:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1); }
  .item svg {
    width: 144px;
    height: 144px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 32px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
  }
  .item h3 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }
  .item .num {
    display: inline-block;
    width: 26px; height: 26px;
    background: #fbbf24;
    color: #1a1a1a;
    border-radius: 50%;
    font-weight: 900;
    line-height: 26px;
    margin-right: 6px;
    font-size: 14px;
  }
  .item p { color: #64748b; font-size: 13px; font-weight: 500; }
  .hint {
    margin-top: 32px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
    padding: 16px;
    background: #fff8d6;
    border-radius: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>Vuvuzela 아이콘 후보</h1>
    <p class="sub">상징적인 컨셉 5가지 · 마음에 드는 번호를 알려주세요</p>
  </header>

  <div class="grid">
    <!-- Option 1: Two Hearts -->
    <div class="item">
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6cc"/>
            <stop offset="1" stop-color="#fde68a"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bg1)"/>
        <circle cx="90" cy="120" r="5" fill="#fff" opacity="0.8"/>
        <circle cx="430" cy="130" r="5" fill="#fff" opacity="0.8"/>
        <circle cx="80" cy="400" r="4" fill="#fff" opacity="0.8"/>
        <circle cx="440" cy="380" r="5" fill="#fff" opacity="0.8"/>
        <g transform="translate(196 250) rotate(-18)">
          <path d="M0 -30 C-30 -80 -112 -66 -112 -6 C-112 62 0 130 0 130 C0 130 112 62 112 -6 C112 -66 30 -80 0 -30 Z" fill="#fbbf24"/>
          <ellipse cx="-42" cy="-8" rx="24" ry="12" fill="#fff" opacity="0.4"/>
        </g>
        <g transform="translate(316 250) rotate(18)">
          <path d="M0 -30 C-30 -80 -112 -66 -112 -6 C-112 62 0 130 0 130 C0 130 112 62 112 -6 C112 -66 30 -80 0 -30 Z" fill="#3b82f6"/>
          <ellipse cx="-42" cy="-8" rx="24" ry="12" fill="#fff" opacity="0.4"/>
        </g>
      </svg>
      <h3><span class="num">1</span>두 개의 하트</h3>
      <p>서로 겹친 노랑·파랑 하트, 클래식 커플</p>
    </div>

    <!-- Option 2: Venn Circles -->
    <div class="item">
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6cc"/>
            <stop offset="1" stop-color="#fde68a"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bg2)"/>
        <circle cx="200" cy="256" r="130" fill="#fbbf24" opacity="0.82"/>
        <circle cx="312" cy="256" r="130" fill="#3b82f6" opacity="0.78"/>
        <path d="M256 218 C244 194 214 202 214 234 C214 268 256 306 256 306 C256 306 298 268 298 234 C298 202 268 194 256 218 Z" fill="#ffffff"/>
        <path d="M256 230 C250 220 236 224 236 240 C236 258 256 278 256 278 C256 278 276 258 276 240 C276 224 262 220 256 230 Z" fill="#ef4444"/>
        <ellipse cx="248" cy="240" rx="6" ry="3" fill="#fff" opacity="0.5"/>
      </svg>
      <h3><span class="num">2</span>교집합 (Venn)</h3>
      <p>두 원의 접점이 한마음 · 미니멀 & 모던</p>
    </div>

    <!-- Option 3: V Monogram -->
    <div class="item">
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6cc"/>
            <stop offset="1" stop-color="#fde68a"/>
          </linearGradient>
          <linearGradient id="vg3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fbbf24"/>
            <stop offset="1" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bg3)"/>
        <path d="M256 100 C246 76 216 82 216 114 C216 146 256 182 256 182 C256 182 296 146 296 114 C296 82 266 76 256 100 Z" fill="#ef4444"/>
        <ellipse cx="242" cy="116" rx="9" ry="5" fill="#fff" opacity="0.5"/>
        <path d="M132 220 L256 410 L380 220" stroke="url(#vg3)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <h3><span class="num">3</span>V 모노그램</h3>
      <p>Vuvuzela의 V + 하트 · 브랜드 초성 활용</p>
    </div>

    <!-- Option 4: Infinity -->
    <div class="item">
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6cc"/>
            <stop offset="1" stop-color="#fde68a"/>
          </linearGradient>
          <linearGradient id="ig4" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fbbf24"/>
            <stop offset="1" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bg4)"/>
        <path d="M256 256 C205 176 90 176 90 256 C90 336 205 336 256 256 C307 176 422 176 422 256 C422 336 307 336 256 256 Z" stroke="url(#ig4)" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M256 232 C250 220 232 224 232 244 C232 262 256 282 256 282 C256 282 280 262 280 244 C280 224 262 220 256 232 Z" fill="#ef4444"/>
      </svg>
      <h3><span class="num">4</span>인피니티 ∞</h3>
      <p>영원한 사랑 · 노랑↔파랑 그라디언트</p>
    </div>

    <!-- Option 5: Wedding Rings -->
    <div class="item">
      <svg viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6cc"/>
            <stop offset="1" stop-color="#fde68a"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bg5)"/>
        <!-- Yellow (gold) ring -->
        <circle cx="200" cy="290" r="105" fill="none" stroke="#fbbf24" stroke-width="26"/>
        <!-- Blue ring in front -->
        <circle cx="312" cy="290" r="105" fill="none" stroke="#3b82f6" stroke-width="26"/>
        <!-- Interlock: redraw top-left portion of yellow ring above blue -->
        <path d="M247 234 A105 105 0 0 1 305 200" fill="none" stroke="#fbbf24" stroke-width="26" stroke-linecap="round"/>
        <!-- Diamond gem on yellow ring top -->
        <g transform="translate(200 168)">
          <path d="M0 -22 L18 -6 L0 20 L-18 -6 Z" fill="#ef4444"/>
          <path d="M-8 -8 L4 -14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        </g>
      </svg>
      <h3><span class="num">5</span>커플링 (반지)</h3>
      <p>두 반지 교차 + 다이아 · 결혼 상징</p>
    </div>
  </div>

  <div class="hint">
    💡 마음에 드는 번호(1~5)를 알려주세요. 다른 컨셉/색상 조합이 필요하면 말씀 주세요.
  </div>
</body>
</html>
