<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="infGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Sparkles -->
  <circle cx="88" cy="110" r="5" fill="#fff" opacity="0.85"/>
  <circle cx="440" cy="150" r="4" fill="#fff" opacity="0.85"/>
  <circle cx="70" cy="380" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="450" cy="390" r="5" fill="#fff" opacity="0.85"/>

  <!-- Infinity loop (lemniscate) with yellow→blue gradient -->
  <path d="M256 256 C205 176 90 176 90 256 C90 336 205 336 256 256 C307 176 422 176 422 256 C422 336 307 336 256 256 Z"
        stroke="url(#infGrad)" stroke-width="44"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central heart -->
  <path d="M256 232 C250 220 232 224 232 244 C232 262 256 282 256 282 C256 282 280 262 280 244 C280 224 262 220 256 232 Z" fill="#ef4444"/>
  <ellipse cx="248" cy="244" rx="5" ry="3" fill="#fff" opacity="0.55"/>
</svg>
