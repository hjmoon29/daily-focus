<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbbf24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="부부젤라">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>부부젤라</title>
<style>
  :root {
    --bg: #fefaf0;
    --panel: #ffffff;
    --panel-2: #f8f5ec;
    --text: #0f172a;
    --text-2: #334155;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --accent: #fbbf24;
    --accent-soft: #fef3c7;
    --accent-2: #3b82f6;
    --accent-2-soft: #dbeafe;
    --accent-3: #d97706;
    --wife: #f59e0b;
    --wife-soft: #fef3c7;
    --husband: #3b82f6;
    --husband-soft: #dbeafe;
    --both: #10b981;
    --both-soft: #d1fae5;
    --danger: #ef4444;
    --success: #22c55e;
    --border: rgba(15, 23, 42, 0.06);
    --border-strong: rgba(15, 23, 42, 0.12);
    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.08);
    --btn-text-on-yellow: #1a1a1a;
    --btn-text-on-blue: #ffffff;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 20px;
    --radius-xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
  }
  button, input, textarea, select {
    font-family: inherit;
    -webkit-appearance: none;
    font-size: 15px;
  }
  input[type="date"] { color-scheme: light; }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-top: 4px;
  }
  .app-title {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.8px;
    background: linear-gradient(135deg, #fbbf24 0%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .app-date { color: var(--muted); font-size: 14px; font-weight: 600; }

  .tab { display: none; }
  .tab.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-title .card-title-hint { font-size: 12px; color: var(--muted-2); font-weight: 500; }

  .dday-hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 0%, rgba(251,191,36,0.35), transparent 50%),
      radial-gradient(circle at 90% 100%, rgba(59,130,246,0.28), transparent 50%),
      linear-gradient(135deg, #fff8d6 0%, #eff6ff 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: 28px 22px;
    margin-bottom: 14px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }
  .dday-hero::before {
    content: '';
    position: absolute;
    top: 12px; right: 16px;
    width: 32px; height: 32px;
    background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 70%);
    border-radius: 50%;
  }
  .dday-hero .label {
    display: inline-block;
    color: var(--accent-3);
    background: rgba(255,255,255,0.7);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 14px;
    font-weight: 800;
    backdrop-filter: blur(6px);
  }
  .dday-hero .title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text); letter-spacing: -0.3px; }
  .dday-hero .count {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: -2.5px;
    background: linear-gradient(135deg, #f59e0b 0%, #3b82f6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .dday-hero .date-sub { color: var(--muted); font-size: 13px; margin-top: 10px; font-weight: 600; }

  .together { display: flex; gap: 14px; align-items: center; justify-content: center; }
  .together .name {
    font-weight: 700;
    font-size: 17px;
    padding: 6px 14px;
    border-radius: 100px;
  }
  .together .name.wife { color: var(--wife); background: var(--wife-soft); }
  .together .name.husband { color: var(--husband); background: var(--husband-soft); }
  .together .heart { color: var(--danger); font-size: 22px; filter: drop-shadow(0 2px 4px rgba(239,68,68,0.25)); }
  .together-sub { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; font-weight: 500; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-row .card { margin-bottom: 0; }
  .stat-value { font-size: 32px; font-weight: 900; letter-spacing: -1px; color: var(--text); }
  .stat-sub { color: var(--muted); font-size: 13px; margin-top: 6px; font-weight: 600; }

  .mood-row { display: flex; gap: 8px; }
  .mood-block { flex: 1; text-align: center; min-width: 0; }
  .mood-block .who { font-size: 14px; color: var(--text); margin-bottom: 12px; font-weight: 700; }
  .mood-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .mood-btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 4px 6px;
    cursor: pointer;
    font-size: 22px;
    min-width: 42px;
    min-height: 42px;
    transition: all 0.15s;
  }
  .mood-btn:hover { background: var(--panel-2); border-color: var(--border-strong); }
  .mood-btn.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 3px rgba(251,191,36,0.2);
    transform: scale(1.05);
  }

  .grat-input {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    width: 100%;
    outline: none;
    margin-top: 8px;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .grat-input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }

  .todo-add { display: flex; gap: 6px; margin-bottom: 10px; }
  .todo-add input {
    flex: 1;
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    outline: none;
    min-width: 0;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .todo-add input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }
  .todo-add select {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 10px;
    border-radius: 12px;
    outline: none;
    font-weight: 500;
  }
  .todo-add button {
    background: var(--accent);
    color: var(--btn-text-on-yellow);
    border: none;
    padding: 0 20px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(251,191,36,0.35);
    transition: transform 0.08s, box-shadow 0.15s;
  }
  .todo-add button:hover { box-shadow: 0 4px 12px rgba(251,191,36,0.45); }
  .todo-add button:active { transform: scale(0.96); }
  .todo-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .todo-controls {
    background: var(--panel-2);
    border-radius: 100px;
    padding: 4px;
    display: flex;
    gap: 2px;
    margin-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .todo-controls::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 9px 15px;
    border-radius: 100px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .filter-chip:hover { color: var(--text-2); }
  .filter-chip.active {
    background: var(--panel);
    color: var(--accent-3);
    box-shadow: var(--shadow-sm);
  }
  .todo-list { list-style: none; }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 8px;
    background: var(--panel-2);
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .todo-list li:hover { background: var(--panel); border-color: var(--border); }
  .todo-list li.done { background: transparent; opacity: 0.55; }
  .todo-list li.done .text { text-decoration: line-through; color: var(--muted); }
  .todo-list input[type="checkbox"] {
    width: 22px; height: 22px;
    accent-color: var(--accent-2);
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-list .text { flex: 1; font-size: 15px; min-width: 0; word-break: break-word; font-weight: 500; }
  .owner-badge {
    font-size: 12px;
    padding: 4px 11px;
    border-radius: 100px;
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: -0.1px;
  }
  .owner-badge.wife { background: var(--wife-soft); color: #b45309; }
  .owner-badge.husband { background: var(--husband-soft); color: #1d4ed8; }
  .owner-badge.both { background: var(--both-soft); color: #047857; }
  .todo-list .del {
    background: transparent;
    border: none;
    color: var(--muted-2);
    cursor: pointer;
    font-size: 20px;
    padding: 4px 8px;
    line-height: 1;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .todo-list .del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
  .todo-stats { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: right; font-weight: 600; }
  .empty {
    text-align: center;
    color: var(--muted-2);
    font-size: 14px;
    padding: 32px 12px;
    font-weight: 600;
  }

  .anniv-add { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 4px; }
  .anniv-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
  .anniv-add input, .anniv-add select {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .anniv-add input:focus, .anniv-add select:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }
  .anniv-add label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .anniv-add button {
    background: var(--accent);
    color: var(--btn-text-on-yellow);
    border: none;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(251,191,36,0.35);
    transition: transform 0.08s, box-shadow 0.15s;
  }
  .anniv-add button:hover { box-shadow: 0 4px 12px rgba(251,191,36,0.45); }
  .anniv-add button:active { transform: scale(0.97); }
  .anniv-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--panel-2);
    border: 1px solid transparent;
    margin-bottom: 8px;
    transition: all 0.15s;
  }
  .anniv-item:hover { background: var(--panel); border-color: var(--border); }
  .anniv-item .info { min-width: 0; flex: 1; }
  .anniv-item .info .title { font-weight: 800; font-size: 16px; word-break: break-word; color: var(--text); letter-spacing: -0.2px; }
  .anniv-item .info .date { color: var(--muted); font-size: 13px; margin-top: 4px; font-weight: 600; }
  .anniv-item .right { display: flex; align-items: center; gap: 4px; }
  .anniv-item .dcount {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent-2);
    white-space: nowrap;
    letter-spacing: -0.5px;
  }
  .anniv-item .dcount.past { color: var(--muted); }
  .anniv-item .del { background: transparent; border: none; color: var(--muted-2); cursor: pointer; font-size: 20px; padding: 4px 8px; line-height: 1; border-radius: 6px; transition: all 0.15s; }
  .anniv-item .del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  .budget-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .budget-summary .card { margin-bottom: 0; text-align: center; padding: 20px 16px; }
  .budget-summary .income .stat-value { color: var(--success); }
  .budget-summary .expense .stat-value { color: var(--danger); }
  .budget-add-row { display: grid; grid-template-columns: 80px 1fr; gap: 6px; margin-bottom: 6px; }
  .budget-add-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .budget-add-row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .budget-add-row input, .budget-add-row select,
  .budget-add-row2 input, .budget-add-row2 select,
  .budget-add-row3 input, .budget-add-row3 select {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    outline: none;
    width: 100%;
    min-width: 0;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .budget-add-row input:focus, .budget-add-row select:focus,
  .budget-add-row2 input:focus, .budget-add-row2 select:focus,
  .budget-add-row3 input:focus, .budget-add-row3 select:focus { border-color: var(--accent-2); background: var(--panel); box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }
  .budget-add-btn {
    background: var(--accent-2);
    color: var(--btn-text-on-blue);
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 2px 8px rgba(59,130,246,0.35);
    transition: transform 0.08s, box-shadow 0.15s;
  }
  .budget-add-btn:hover { box-shadow: 0 4px 12px rgba(59,130,246,0.45); }
  .budget-add-btn:active { transform: scale(0.98); }
  .budget-list { list-style: none; }
  .budget-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border-radius: 14px;
    background: var(--panel-2);
    border: 1px solid transparent;
    margin-bottom: 8px;
    transition: all 0.15s;
  }
  .budget-item:hover { background: var(--panel); border-color: var(--border); }
  .budget-item .memo { font-size: 16px; word-break: break-word; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
  .budget-item .meta { color: var(--muted); font-size: 12.5px; margin-top: 5px; font-weight: 600; }
  .budget-item .amount { font-weight: 900; font-size: 18px; white-space: nowrap; letter-spacing: -0.4px; }
  .budget-item .amount.income { color: var(--success); }
  .budget-item .amount.expense { color: var(--danger); }
  .budget-item .del { background: transparent; border: none; color: var(--muted-2); cursor: pointer; font-size: 18px; padding: 4px 8px; line-height: 1; border-radius: 6px; transition: all 0.15s; }
  .budget-item .del:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
  .budget-item .info { min-width: 0; flex: 1; }
  .cat-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-pill {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    padding: 9px 15px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--text);
    font-weight: 700;
    transition: all 0.15s;
  }
  .cat-pill:hover { border-color: var(--accent); }
  .cat-pill .cat-amount { color: var(--accent-3); font-weight: 800; margin-left: 8px; }

  .notes-area {
    width: 100%;
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 14px;
    padding: 14px;
    resize: vertical;
    min-height: 160px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.7;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    font-weight: 500;
  }
  .notes-area:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }
  .notes-status { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: right; font-weight: 600; }

  .profile-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; margin-bottom: 12px; align-items: center; }
  .profile-row label { color: var(--text); font-size: 14px; font-weight: 700; }
  .profile-row input, .profile-row select {
    background: var(--panel-2);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .profile-row input:focus, .profile-row select:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }

  .btn {
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    box-shadow: var(--shadow-xs);
    transition: transform 0.05s, box-shadow 0.15s, border-color 0.15s;
  }
  .btn:hover { border-color: var(--border-strong); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: var(--accent);
    color: var(--btn-text-on-yellow);
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(251,191,36,0.35);
  }
  .btn.primary:hover { box-shadow: 0 4px 12px rgba(251,191,36,0.45); border-color: var(--accent); }
  .btn.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .gnb {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    z-index: 90;
  }
  .gnb button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    cursor: pointer;
    min-height: 52px;
    border-radius: 14px;
    transition: color 0.2s, background 0.2s;
  }
  .gnb button .ico {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gnb button .ico svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke-width 0.15s;
  }
  .gnb button .lb {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: -0.1px;
  }
  .gnb button:hover { color: var(--text-2); }
  .gnb button.active { color: var(--accent-3); }
  .gnb button.active .ico svg { stroke-width: 2.4; }
  .gnb button.active .lb { font-weight: 700; }
  .gnb button.active::before {
    content: '';
    position: absolute;
    top: 6px;
    width: 32px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-3));
    border-radius: 100px;
  }

  .update-toast {
    position: fixed;
    left: 50%;
    bottom: calc(88px + env(safe-area-inset-bottom));

</style>

<body>

  <!-- GNB -->
  <nav class="gnb" id="gnb">
    <button data-tab="home" class="active">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V11a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a1 1 0 0 1-1 1h-4v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></span>
      <span class="lb">홈</span>
    </button>
    <button data-tab="todo">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 12l3 3 5-6"/></svg></span>

      <span class="ico"><svg viewBox="0 0 24 24"><path d="M20.5 8.5a5 5 0 0 0-8.5-3.5 5 5 0 0 0-8.5 3.5c0 5.5 8.5 11 8.5 11s8.5-5.5 8.5-11z"/></svg></span>

      <span class="ico"><svg viewBox="0 0 24 24"><path d="M20 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2"/><path d="M22 12h-5a2 2 0 0 0 0 4h5v-4z"/></svg></span>

      <span class="lb">더보기</span>

  <div class="update-toast" id="updateToast">
    <span>새 버전이 준비됐어요</span>
    <button id="updateApply">새로고침</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmtWon = (n) => (n||0).toLocaleString('ko-KR') + '원';

  const LS = {
    get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch { return def; } },
    set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  };

  let profile = LS.get('us:profile', { wife: '아내', husband: '남편', metDate: '', wedDate: '', ddaySrc: 'auto' });
  let todos = LS.get('us:todos', []);
  let anniversaries = LS.get('us:anniversaries', []);
  let budget = LS.get('us:budget', []);
  let currentFilter = 'all';
  let currentNotesDate = todayKey();

  // One-time migration from old Daily Focus todos
  if (!LS.get('us:migrated', false)) {
    try {
      const oldTodos = JSON.parse(localStorage.getItem('todos') || '[]');
      if (Array.isArray(oldTodos) && oldTodos.length > 0 && todos.length === 0) {
        todos = oldTodos.map(t => ({
          id: uid(), text: t.text, done: !!t.done, owner: 'both', createdAt: Date.now()
        }));
        LS.set('us:todos', todos);
      }
    } catch {}
    LS.set('us:migrated', true);
  }

  const MOODS = ['😄','🙂','😐','😢','😡','😴','😍','🤔'];

  function renderTodayLabel() {
    $('today').textContent = new Date().toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  }

  // ============ Tabs ============
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const el = $('tab-'+name);
    if (el) el.classList.add('active');
    document.querySelectorAll('#gnb button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    if (location.hash !== '#'+name) history.replaceState(null, '', '#'+name);
    window.scrollTo(0, 0);
    if (name === 'home') renderHome();
    else if (name === 'todo') renderTodos();
    else if (name === 'anniv') renderAnnivs();
    else if (name === 'budget') { renderBudget(); if (!$('bDate').value) $('bDate').value = todayKey(); }
    else if (name === 'more') { loadProfile(); loadNotesForToday(); }
  }
  document.querySelectorAll('#gnb button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ============ Home ============
  function daysBetween(a, b) {
    const ma = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    const mb = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((mb - ma) / (1000*60*60*24));
  }
  function computeDday(dateStr, repeat) {
    if (!dateStr) return null;
    const parts = dateStr.split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return null;
    const [y, m, d] = parts;
    const origin = new Date(y, m-1, d);
    const now = new Date();
    const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let target = origin;
    if (repeat) {
      target = new Date(now.getFullYear(), m-1, d);
      if (target < todayMidnight) target = new Date(now.getFullYear()+1, m-1, d);
    }
    const days = daysBetween(todayMidnight, target);
    return { target, days, origin };
  }
  function pickHomeDday() {
    const src = profile.ddaySrc || 'auto';
    if (src === 'met' && profile.metDate) {
      const dd = computeDday(profile.metDate, true);
      if (dd) return { title: `${profile.wife || '아내'}♥${profile.husband || '남편'} 만난 날`, ...dd, sub: profile.metDate };
    }
    if (src === 'wed' && profile.wedDate) {
      const dd = computeDday(profile.wedDate, true);
      if (dd) return { title: '결혼기념일', ...dd, sub: profile.wedDate };
    }
    const candidates = [];
    anniversaries.forEach(a => {
      const dd = computeDday(a.date, a.repeatYearly);
      if (dd) candidates.push({ title: a.title, ...dd, sub: a.date });
    });
    if (profile.metDate) {
      const dd = computeDday(profile.metDate, true);
      if (dd) candidates.push({ title: '만난 기념일', ...dd, sub: profile.metDate });
    }
    if (profile.wedDate) {
      const dd = computeDday(profile.wedDate, true);
      if (dd) candidates.push({ title: '결혼기념일', ...dd, sub: profile.wedDate });
    }
    if (candidates.length === 0) return null;
    const future = candidates.filter(c => c.days >= 0).sort((a,b) => a.days - b.days);
    if (future.length > 0) return future[0];
    candidates.sort((a,b) => Math.abs(a.days) - Math.abs(b.days));
    return candidates[0];
  }
  function ddayLabel(days) {
    if (days === 0) return 'D-DAY';
    if (days > 0) return `D-${days}`;
    return `D+${-days}`;
  }
  function renderHome() {
    const dd = pickHomeDday();
    if (dd) {
      $('ddayTitle').textContent = dd.title;
      $('ddayCount').textContent = ddayLabel(dd.days);
      $('ddaySub').textContent = dd.sub || '';
    } else {
      $('ddayTitle').textContent = '기념일을 등록해보세요';
      $('ddayCount').textContent = '♥';
      $('ddaySub').textContent = '더보기 > 기념일 탭에서 등록';
    }

    renderMood();

    const grat = LS.get(`us:grat-${todayKey()}`, {wife:'', husband:''});
    $('gratWife').value = grat.wife || '';
    $('gratHusband').value = grat.husband || '';
    $('gratWife').placeholder = `${profile.wife || '아내'}의 감사 한 줄`;
    $('gratHusband').placeholder = `${profile.husband || '남편'}의 감사 한 줄`;

    const undoneCount = todos.filter(x => !x.done).length;
    const doneCount = todos.filter(x => x.done).length;
    $('statTodo').textContent = undoneCount;
    $('statTodoSub').textContent = `완료 ${doneCount} / ${todos.length}`;

    const mk = monthKey();
    const monthExp = budget.filter(b => b.type==='expense' && (b.date||'').startsWith(mk))
      .reduce((s,b) => s + Number(b.amount||0), 0);
    const monthInc = budget.filter(b => b.type==='income' && (b.date||'').startsWith(mk))
      .reduce((s,b) => s + Number(b.amount||0), 0);
    $('statBudget').textContent = fmtWon(monthExp);
    $('statBudgetSub').textContent = `수입 ${fmtWon(monthInc)}`;
  }
  function renderMood() {
    const data = LS.get(`us:mood-${todayKey()}`, {wife:null, husband:null});
    $('moodWifeLabel').textContent = profile.wife || '아내';
    $('moodHusbandLabel').textContent = profile.husband || '남편';
    ['Wife','Husband'].forEach(role => {
      const key = role.toLowerCase();
      const container = $(`mood${role}Btns`);
      container.innerHTML = '';
      MOODS.forEach(m => {
        const b = document.createElement('button');
        b.className = 'mood-btn' + (data[key] === m ? ' active' : '');
        b.textContent = m;
        b.addEventListener('click', () => {
          const next = LS.get(`us:mood-${todayKey()}`, {wife:null, husband:null});
          next[key] = (next[key] === m) ? null : m;
          LS.set(`us:mood-${todayKey()}`, next);
          renderMood();
        });
        container.appendChild(b);
      });
    });
  }
  ['gratWife','gratHusband'].forEach(id => {
    $(id).addEventListener('input', () => {
      const g = LS.get(`us:grat-${todayKey()}`, {wife:'', husband:''});
      g.wife = $('gratWife').value;
      g.husband = $('gratHusband').value;
      LS.set(`us:grat-${todayKey()}`, g);
    });
  });

  // ============ Todo ============
  function saveTodos() {
    LS.set('us:todos', todos);
    renderTodos();
    if ($('tab-home').classList.contains('active')) renderHome();
  }
  function renderTodos() {
    $('filterWife').textContent = profile.wife || '아내';
    $('filterHusband').textContent = profile.husband || '남편';
    const list = $('todoList');
    list.innerHTML = '';
    let items = todos.slice();
    if (currentFilter === 'wife') items = items.filter(t => t.owner === 'wife');
    else if (currentFilter === 'husband') items = items.filter(t => t.owner === 'husband');
    else if (currentFilter === 'both') items = items.filter(t => t.owner === 'both');
    else if (currentFilter === 'undone') items = items.filter(t => !t.done);
    items.sort((a,b) => (a.done - b.done) || (b.createdAt - a.createdAt));
    if (items.length === 0) {
      list.innerHTML = '<div class="empty">할 일이 없어요</div>';
    } else {
      items.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');
        li.innerHTML = `
          <input type="checkbox" ${t.done?'checked':''}>
          <span class="text"></span>
          <span class="owner-badge"></span>
          <button class="del" aria-label="삭제">×</button>
        `;
        li.querySelector('.text').textContent = t.text;
        const badge = li.querySelector('.owner-badge');
        badge.classList.add(t.owner);
        badge.textContent = t.owner === 'wife' ? (profile.wife || '아내')
                          : t.owner === 'husband' ? (profile.husband || '남편')
                          : '함께';
        li.querySelector('input').addEventListener('change', () => {
          const orig = todos.find(x => x.id === t.id);
          if (orig) { orig.done = !orig.done; saveTodos(); }
        });
        li.querySelector('.del').addEventListener('click', () => {
          todos = todos.filter(x => x.id !== t.id);
          saveTodos();
        });
        list.appendChild(li);
      });
    }
    const done = todos.filter(x => x.done).length;
    $('todoStats').textContent = `${done} / ${todos.length} 완료`;
  }
  document.querySelectorAll('#tab-todo .filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#tab-todo .filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderTodos();
    });
  });
  $('todoAdd').addEventListener('click', () => {
    const text = $('todoInput').value.trim();
    if (!text) return;
    todos.push({ id: uid(), text, owner: $('todoOwner').value, done: false, createdAt: Date.now() });
    $('todoInput').value = '';
    saveTodos();
  });
  $('todoInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('todoAdd').click(); });

  // ============ Anniversary ============
  function saveAnnivs() {
    LS.set('us:anniversaries', anniversaries);
    renderAnnivs();
    if ($('tab-home').classList.contains('active')) renderHome();
  }
  function renderAnnivs() {
    const list = $('annivList');
    list.innerHTML = '';
    if (anniversaries.length === 0) {
      list.innerHTML = '<div class="empty">기념일이 아직 없어요</div>';
      return;
    }
    const items = anniversaries.map(a => ({ ...a, dd: computeDday(a.date, a.repeatYearly) }));
    items.sort((a,b) => {
      const da = a.dd ? a.dd.days : 99999;
      const db = b.dd ? b.dd.days : 99999;
      if (da >= 0 && db < 0) return -1;
      if (da < 0 && db >= 0) return 1;
      return Math.abs(da) - Math.abs(db);
    });
    items.forEach(a => {
      const row = document.createElement('div');
      row.className = 'anniv-item';
      const label = a.dd ? ddayLabel(a.dd.days) : '-';
      row.innerHTML = `
        <div class="info">
          <div class="title"></div>
          <div class="date"></div>
        </div>
        <div class="right">
          <span class="dcount"></span>
          <button class="del" aria-label="삭제">×</button>
        </div>
      `;
      row.querySelector('.title').textContent = a.title;
      row.querySelector('.date').textContent = a.date + (a.repeatYearly ? ' · 매년' : '');
      const dc = row.querySelector('.dcount');
      dc.textContent = label;
      if (a.dd && a.dd.days < 0 && !a.repeatYearly) dc.classList.add('past');
      row.querySelector('.del').addEventListener('click', () => {
        if (confirm(`"${a.title}" 기념일을 삭제할까요?`)) {
          anniversaries = anniversaries.filter(x => x.id !== a.id);
          saveAnnivs();
        }
      });
      list.appendChild(row);
    });
  }
  $('annivAdd').addEventListener('click', () => {
    const title = $('annivTitle').value.trim();
    const date = $('annivDate').value;
    if (!title || !date) { alert('제목과 날짜를 입력해주세요'); return; }
    anniversaries.push({
      id: uid(),
      title,
      date,
      repeatYearly: $('annivRepeat').checked
    });
    $('annivTitle').value = '';
    $('annivDate').value = '';
    $('annivRepeat').checked = true;
    saveAnnivs();
  });

  // ============ Budget ============
  function saveBudget() {
    LS.set('us:budget', budget);
    renderBudget();
    if ($('tab-home').classList.contains('active')) renderHome();
  }
  function renderBudget() {
    const mk = monthKey();
    const monthItems = budget.filter(b => (b.date||'').startsWith(mk));
    const sumInc = monthItems.filter(b => b.type==='income').reduce((s,b)=>s+Number(b.amount||0),0);
    const sumExp = monthItems.filter(b => b.type==='expense').reduce((s,b)=>s+Number(b.amount||0),0);
    $('incomeSum').textContent = fmtWon(sumInc);
    $('expenseSum').textContent = fmtWon(sumExp);

    const byCat = {};
    monthItems.filter(b=>b.type==='expense').forEach(b => {
      const c = b.category || '기타';
      byCat[c] = (byCat[c]||0) + Number(b.amount||0);
    });
    const catList = $('catList');
    catList.innerHTML = '';
    const sortedCats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
    if (sortedCats.length === 0) {
      catList.innerHTML = '<div class="empty" style="width:100%">이번달 지출 내역이 없어요</div>';
    } else {
      sortedCats.forEach(([cat, amount]) => {
        const p = document.createElement('div');
        p.className = 'cat-pill';
        const catSpan = document.createElement('span');
        catSpan.textContent = cat;
        const amtSpan = document.createElement('span');
        amtSpan.className = 'cat-amount';
        amtSpan.textContent = fmtWon(amount);
        p.appendChild(catSpan);
        p.appendChild(amtSpan);
        catList.appendChild(p);
      });
    }

    const listEl = $('budgetList');
    listEl.innerHTML = '';
    const recent = budget.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 50);
    if (recent.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 내역이 없어요</div>';
      return;
    }
    recent.forEach(b => {
      const li = document.createElement('li');
      li.className = 'budget-item';
      const ownerLabel = b.owner === 'wife' ? (profile.wife || '아내')
                       : b.owner === 'husband' ? (profile.husband || '남편')
                       : '공동';
      const sign = b.type === 'income' ? '+' : '-';
      li.innerHTML = `
        <div class="info">
          <div class="memo"></div>
          <div class="meta"></div>
        </div>
        <div class="amount"></div>
        <button class="del" aria-label="삭제">×</button>
      `;
      li.querySelector('.memo').textContent = b.memo || '(내용 없음)';
      li.querySelector('.meta').textContent = `${b.category || '기타'} · ${ownerLabel} · ${b.date}`;
      const amtEl = li.querySelector('.amount');
      amtEl.classList.add(b.type);
      amtEl.textContent = sign + fmtWon(b.amount);
      li.querySelector('.del').addEventListener('click', () => {
        budget = budget.filter(x => x.id !== b.id);
        saveBudget();
      });
      listEl.appendChild(li);
    });
  }
  $('bAdd').addEventListener('click', () => {
    const amount = Number($('bAmount').value);
    if (!amount || amount <= 0) { alert('금액을 입력해주세요'); return; }
    budget.push({
      id: uid(),
      type: $('bType').value,
      memo: $('bMemo').value.trim(),
      amount,
      category: $('bCategory').value,
      owner: $('bOwner').value,
      date: $('bDate').value || todayKey(),
      createdAt: Date.now()
    });
    $('bMemo').value = '';
    $('bAmount').value = '';
    saveBudget();
  });

  // ============ Profile ============
  function loadProfile() {
    $('pWife').value = profile.wife || '';
    $('pHusband').value = profile.husband || '';
    $('pMet').value = profile.metDate || '';
    $('pWed').value = profile.wedDate || '';
    $('pDdaySrc').value = profile.ddaySrc || 'auto';
  }
  $('pSave').addEventListener('click', () => {
    profile = {
      wife: $('pWife').value.trim() || '아내',
      husband: $('pHusband').value.trim() || '남편',
      metDate: $('pMet').value,
      wedDate: $('pWed').value,
      ddaySrc: $('pDdaySrc').value
    };
    LS.set('us:profile', profile);
    alert('저장되었어요');
    renderHome();
    renderTodos();
    renderBudget();
  });

  // ============ Notes ============
  const notes = $('notes');
  const notesStatus = $('notesStatus');
  let saveTimeout = null;
  function loadNotesForToday() {
    currentNotesDate = todayKey();
    notes.value = localStorage.getItem(`us:notes-${currentNotesDate}`) || '';
    notesStatus.textContent = '저장됨';
  }
  function saveNotesNow() {
    localStorage.setItem(`us:notes-${currentNotesDate}`, notes.value);
  }
  notes.addEventListener('input', () => {
    notesStatus.textContent = '입력 중...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveNotesNow();
      notesStatus.textContent = `저장됨 · ${new Date().toLocaleTimeString('ko-KR')}`;
    }, 400);
  });

  // ============ Export / Import / Reset ============
  function collectAll() {
    const data = {};
    for (let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('us:')) data[k] = localStorage.getItem(k);
    }
    return { app: 'us-daily', version: 3, exportedAt: new Date().toISOString(), data };
  }
  $('btnExport').addEventListener('click', () => {
    const bundle = collectAll();
    const blob = new Blob([JSON.stringify(bundle, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `us-daily-backup-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
  $('btnImport').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.data) throw new Error('invalid');
        if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
        Object.keys(localStorage).filter(k=>k.startsWith('us:')).forEach(k=>localStorage.removeItem(k));
        Object.entries(parsed.data).forEach(([k,v]) => localStorage.setItem(k, v));
        alert('복원되었습니다. 새로고침합니다.');
        location.reload();
      } catch (err) {
        alert('복원 실패: 올바른 JSON 파일이 아닙니다');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  $('btnReset').addEventListener('click', () => {
    if (!confirm('모든 우리 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
    if (!confirm('정말 삭제할까요? (마지막 확인)')) return;
    Object.keys(localStorage).filter(k=>k.startsWith('us:')).forEach(k=>localStorage.removeItem(k));
    location.reload();
  });

  // ============ Boot ============
  renderTodayLabel();
  loadProfile();
  loadNotesForToday();
  const initTab = (location.hash || '#home').replace('#','');
  if (['home','todo','anniv','budget','more'].includes(initTab)) switchTab(initTab);
  else switchTab('home');

  function checkDayRollover() {
    const nowKey = todayKey();
    if (nowKey !== currentNotesDate) {
      if (saveTimeout) { clearTimeout(saveTimeout); saveNotesNow(); }
      loadNotesForToday();
      renderTodayLabel();
      renderHome();
    }
  }
  setInterval(checkDayRollover, 60*1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      checkDayRollover();
      if ($('tab-home').classList.contains('active')) renderHome();
    }
  });

  // ============ Service Worker ============
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              const toast = $('updateToast');
              toast.classList.add('show');
              $('updateApply').onclick = () => nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
        reg.update().catch(() => {});
      }).catch(() => {});
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    });
  }
</script>
</body>
</html>
