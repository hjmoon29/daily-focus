<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Focus">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>Daily Focus</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232732;
    --text: #e6e8ee;
    --muted: #8a90a2;
    --accent: #7aa2f7;
    --accent-2: #9ece6a;
    --danger: #f7768e;
    --border: #2a2f3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  button, input, textarea { font-family: inherit; -webkit-appearance: none; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .date { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    min-height: 400px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 600;
  }
  /* Todo */
  .todo-input {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .todo-input input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .todo-input input:focus { border-color: var(--accent); }
  .todo-input button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .todo-list { list-style: none; overflow-y: auto; flex: 1; }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .todo-list li:hover { background: var(--panel-2); }
  .todo-list li.done .text { text-decoration: line-through; color: var(--muted); }
  .todo-list input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer;
    accent-color: var(--accent-2);
  }
  .todo-list .text { flex: 1; font-size: 14px; }
  .todo-list .del {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .todo-list .del:hover { color: var(--danger); background: var(--panel-2); }
  .todo-stats { color: var(--muted); font-size: 12px; margin-top: 8px; }
  /* Pomodoro */
  .timer-display {
    font-size: 72px;
    font-weight: 200;
    text-align: center;
    letter-spacing: -2px;
    margin: 24px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer-mode {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .timer-controls button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .timer-controls button.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .timer-controls button:hover { opacity: 0.85; }
  .mode-switch {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: auto;
  }
  .mode-switch button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .mode-switch button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .session-count {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 12px;
  }
  .lock-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--accent-2);
    border: 1px solid var(--border);
    vertical-align: middle;
  }
  .lock-badge.hidden { display: none; }
  /* Notes */
  .notes-area {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .notes-area:focus { border-color: var(--accent); }
  .notes-status {
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
    text-align: right;
  }
  .update-toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    display: none;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 100;
  }
  .update-toast.show { display: flex; }
  .update-toast button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .panel { min-height: auto; padding: 16px; }
    .header { margin-bottom: 16px; }
    .header h1 { font-size: 20px; }
    .timer-display { font-size: 64px; margin: 16px 0; }
    .todo-input input, .notes-area { font-size: 16px; }
    .todo-input button, .timer-controls button, .todo-list .del { min-height: 44px; }
    .todo-list input[type="checkbox"] { width: 22px; height: 22px; }
    .todo-list li { padding: 12px 10px; }
    .todo-list .del { font-size: 20px; padding: 6px 10px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Daily Focus</h1>
    <div class="date" id="today"></div>
  </div>
  <div class="grid">
    <div class="panel">
      <h2>할 일</h2>
      <div class="todo-input">
        <input id="todoInput" type="text" placeholder="새 할 일을 입력하고 Enter" maxlength="200">
        <button id="todoAdd">추가</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <div class="todo-stats" id="todoStats">0 / 0 완료</div>
    </div>

    <div class="panel">
      <h2>집중 타이머<span id="lockBadge" class="lock-badge hidden">화면 유지</span></h2>
      <div class="timer-mode" id="timerMode">Focus</div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button id="timerStart" class="primary">시작</button>
        <button id="timerReset">리셋</button>
      </div>
      <div class="session-count" id="sessionCount">오늘 완료한 세션: 0</div>
      <div class="mode-switch">
        <button data-mode="focus" data-time="25" class="active">집중 25</button>
        <button data-mode="short" data-time="5">짧은 휴식 5</button>
        <button data-mode="long" data-time="15">긴 휴식 15</button>
      </div>
    </div>

    <div class="panel">
      <h2>오늘 메모</h2>
      <textarea id="notes" class="notes-area" placeholder="자유롭게 메모하세요..."></textarea>
      <div class="notes-status" id="notesStatus">저장됨</div>
    </div>
  </div>

  <div class="update-toast" id="updateToast">
    <span>새 버전이 준비됐어요</span>
    <button id="updateApply">새로고침</button>
  </div>

<script>
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const renderTodayLabel = () => {
    document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  };
  renderTodayLabel();

  // --- Todo ---
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  const todoStats = document.getElementById('todoStats');
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function renderTodos() {
    todoList.innerHTML = '';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      li.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''}>
        <span class="text"></span>
        <button class="del">×</button>
      `;
      li.querySelector('.text').textContent = t.text;
      li.querySelector('input').addEventListener('change', () => {
        todos[i].done = !todos[i].done;
        saveTodos();
      });
      li.querySelector('.del').addEventListener('click', () => {
        todos.splice(i, 1);
        saveTodos();
      });
      todoList.appendChild(li);
    });
    const done = todos.filter(t => t.done).length;
    todoStats.textContent = `${done} / ${todos.length} 완료`;
  }
  function saveTodos() {
    localStorage.setItem('todos', JSON.stringify(todos));
    renderTodos();
  }
  function addTodo() {
    const v = todoInput.value.trim();
    if (!v) return;
    todos.push({ text: v, done: false });
    todoInput.value = '';
    saveTodos();
  }
  document.getElementById('todoAdd').addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  renderTodos();

  // --- Timer (Date.now() 기반 — 백그라운드 throttle에도 정확) ---
  const MODE_MINUTES = { focus: 25, short: 5, long: 15 };
  const MODE_LABEL   = { focus: 'Focus', short: 'Short Break', long: 'Long Break' };
  let currentMode = 'focus';
  let durationMs  = MODE_MINUTES[currentMode] * 60 * 1000;
  let remainingMs = durationMs;   // 일시정지/정지 상태에서의 남은 시간
  let endAt       = null;          // 실행 중일 때 종료 절대시각
  let intervalId  = null;
  let wakeLock    = null;

  const display        = document.getElementById('timerDisplay');
  const startBtn       = document.getElementById('timerStart');
  const resetBtn       = document.getElementById('timerReset');
  const modeLabel      = document.getElementById('timerMode');
  const sessionCountEl = document.getElementById('sessionCount');
  const lockBadge      = document.getElementById('lockBadge');

  function loadSessions() {
    const data = JSON.parse(localStorage.getItem('sessions') || '{}');
    return data[todayKey()] || 0;
  }
  function incrementSession() {
    const data = JSON.parse(localStorage.getItem('sessions') || '{}');
    const k = todayKey();
    data[k] = (data[k] || 0) + 1;
    localStorage.setItem('sessions', JSON.stringify(data));
    renderSessions();
  }
  function renderSessions() {
    sessionCountEl.textContent = `오늘 완료한 세션: ${loadSessions()}`;
  }
  renderSessions();

  function updateDisplay() {
    const totalSec = Math.max(0, Math.ceil(remainingMs / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.title = `${display.textContent} - Daily Focus`;
  }

  function playChime() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const audio = new AC();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.connect(gain); gain.connect(audio.destination);
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.15, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.8);
      osc.start(); osc.stop(audio.currentTime + 0.8);
    } catch(e) {}
  }

  function notify(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        const n = new Notification(title, {
          body,
          icon: 'icon-192.svg',
          badge: 'icon-192.svg',
          tag: 'daily-focus-timer',
          renotify: true
        });
        n.onclick = () => { window.focus(); n.close(); };
        return;
      } catch (e) {}
    }
    // 알림 권한 없거나 실패하면 페이지가 보일 때만 alert (백그라운드에선 노출 안 됨)
    if (document.visibilityState === 'visible') {
      alert(`${title}\n${body}`);
    }
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      lockBadge.classList.remove('hidden');
      wakeLock.addEventListener('release', () => {
        lockBadge.classList.add('hidden');
      });
    } catch (e) {
      // 사용자가 거부하거나 배터리 절약 모드 등
    }
  }
  async function releaseWakeLock() {
    if (wakeLock) {
      try { await wakeLock.release(); } catch(e) {}
      wakeLock = null;
      lockBadge.classList.add('hidden');
    }
  }

  async function ensureNotifyPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      try { await Notification.requestPermission(); } catch(e) {}
    }
  }

  function tick() {
    if (endAt === null) return;
    remainingMs = Math.max(0, endAt - Date.now());
    updateDisplay();
    if (remainingMs <= 0) complete();
  }

  function start() {
    if (remainingMs <= 0) remainingMs = durationMs;
    endAt = Date.now() + remainingMs;
    intervalId = setInterval(tick, 500);
    startBtn.textContent = '일시정지';
    ensureNotifyPermission();
    requestWakeLock();
    updateDisplay();
  }
  function pause() {
    remainingMs = Math.max(0, endAt - Date.now());
    clearInterval(intervalId);
    intervalId = null;
    endAt = null;
    startBtn.textContent = '재개';
    releaseWakeLock();
    updateDisplay();
  }
  function reset() {
    clearInterval(intervalId);
    intervalId = null;
    endAt = null;
    remainingMs = durationMs;
    startBtn.textContent = '시작';
    releaseWakeLock();
    updateDisplay();
  }
  function complete() {
    clearInterval(intervalId);
    intervalId = null;
    endAt = null;
    remainingMs = 0;
    startBtn.textContent = '시작';
    updateDisplay();
    releaseWakeLock();
    if (currentMode === 'focus') incrementSession();
    playChime();
    const isFocus = currentMode === 'focus';
    notify(
      isFocus ? '집중 세션 완료' : '휴식 종료',
      isFocus ? '잠깐 쉬세요.' : '다시 집중해봅시다.'
    );
    // 완료 후 다음 세션을 위해 duration으로 복귀
    remainingMs = durationMs;
    updateDisplay();
  }

  startBtn.addEventListener('click', () => {
    if (endAt !== null) pause();
    else start();
  });
  resetBtn.addEventListener('click', reset);
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      durationMs = MODE_MINUTES[currentMode] * 60 * 1000;
      modeLabel.textContent = MODE_LABEL[currentMode];
      reset();
    });
  });
  updateDisplay();

  // --- Notes (일자별 키, 자정 롤오버 대응) ---
  const notes = document.getElementById('notes');
  const notesStatus = document.getElementById('notesStatus');
  let currentNotesDate = todayKey();

  function loadNotesForToday() {
    currentNotesDate = todayKey();
    notes.value = localStorage.getItem(`notes-${currentNotesDate}`) || '';
    notesStatus.textContent = '저장됨';
  }
  function saveNotesNow() {
    localStorage.setItem(`notes-${currentNotesDate}`, notes.value);
  }
  loadNotesForToday();

  let saveTimeout = null;
  notes.addEventListener('input', () => {
    notesStatus.textContent = '입력 중...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveNotesNow();
      notesStatus.textContent = `저장됨 · ${new Date().toLocaleTimeString('ko-KR')}`;
    }, 400);
  });

  // 자정 롤오버 감지: 가시 상태로 돌아오거나 매 분 체크
  function checkDayRollover() {
    const nowKey = todayKey();
    if (nowKey !== currentNotesDate) {
      // 어제 메모를 마지막으로 저장 후 오늘 메모 로드
      if (saveTimeout) { clearTimeout(saveTimeout); saveNotesNow(); }
      loadNotesForToday();
      renderTodayLabel();
      renderSessions();
    }
  }
  setInterval(checkDayRollover, 60 * 1000);

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      checkDayRollover();
      renderSessions();
      if (endAt !== null) {
        tick();                  // 백그라운드에서 벗어나며 즉시 시간 동기화
        if (!wakeLock) await requestWakeLock(); // wake lock은 hidden 시 해제됨 → 재요청
      }
    }
  });

  // --- Service Worker + 업데이트 감지 ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // 새 워커 감지 시 사용자에게 새로고침 안내
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              const toast = document.getElementById('updateToast');
              const apply = document.getElementById('updateApply');
              toast.classList.add('show');
              apply.onclick = () => {
                nw.postMessage({ type: 'SKIP_WAITING' });
              };
            }
          });
        });
        // 매 방문 시 업데이트 체크
        reg.update().catch(() => {});
      }).catch(() => {});

      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
    });
  }
</script>
</body>
</html>
