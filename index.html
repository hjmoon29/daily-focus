<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Focus">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>Daily Focus</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232732;
    --text: #e6e8ee;
    --muted: #8a90a2;
    --accent: #7aa2f7;
    --accent-2: #9ece6a;
    --danger: #f7768e;
    --border: #2a2f3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  button, input, textarea { font-family: inherit; -webkit-appearance: none; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }
  .header h1 { font-size: 24px; font-weight: 600; }
  .header .date { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    min-height: 400px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 600;
  }
  /* Todo */
  .todo-input {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .todo-input input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  .todo-input input:focus { border-color: var(--accent); }
  .todo-input button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .todo-list { list-style: none; overflow-y: auto; flex: 1; }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .todo-list li:hover { background: var(--panel-2); }
  .todo-list li.done .text { text-decoration: line-through; color: var(--muted); }
  .todo-list input[type="checkbox"] {
    width: 18px; height: 18px; cursor: pointer;
    accent-color: var(--accent-2);
  }
  .todo-list .text { flex: 1; font-size: 14px; }
  .todo-list .del {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .todo-list .del:hover { color: var(--danger); background: var(--panel-2); }
  .todo-stats { color: var(--muted); font-size: 12px; margin-top: 8px; }
  /* Pomodoro */
  .timer-display {
    font-size: 72px;
    font-weight: 200;
    text-align: center;
    letter-spacing: -2px;
    margin: 24px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer-mode {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .timer-controls button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .timer-controls button.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .timer-controls button:hover { opacity: 0.85; }
  .mode-switch {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: auto;
  }
  .mode-switch button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .mode-switch button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .session-count {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 12px;
  }
  /* Notes */
  .notes-area {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
  }
  .notes-area:focus { border-color: var(--accent); }
  .notes-status {
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
    text-align: right;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .panel { min-height: auto; padding: 16px; }
    .header { margin-bottom: 16px; }
    .header h1 { font-size: 20px; }
    .timer-display { font-size: 64px; margin: 16px 0; }
    .todo-input input, .notes-area { font-size: 16px; }
    .todo-input button, .timer-controls button, .todo-list .del { min-height: 44px; }
    .todo-list input[type="checkbox"] { width: 22px; height: 22px; }
    .todo-list li { padding: 12px 10px; }
    .todo-list .del { font-size: 20px; padding: 6px 10px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Daily Focus</h1>
    <div class="date" id="today"></div>
  </div>
  <div class="grid">
    <div class="panel">
      <h2>할 일</h2>
      <div class="todo-input">
        <input id="todoInput" type="text" placeholder="새 할 일을 입력하고 Enter" maxlength="200">
        <button id="todoAdd">추가</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <div class="todo-stats" id="todoStats">0 / 0 완료</div>
    </div>

    <div class="panel">
      <h2>집중 타이머</h2>
      <div class="timer-mode" id="timerMode">Focus</div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button id="timerStart" class="primary">시작</button>
        <button id="timerReset">리셋</button>
      </div>
      <div class="session-count" id="sessionCount">오늘 완료한 세션: 0</div>
      <div class="mode-switch">
        <button data-mode="focus" data-time="25" class="active">집중 25</button>
        <button data-mode="short" data-time="5">짧은 휴식 5</button>
        <button data-mode="long" data-time="15">긴 휴식 15</button>
      </div>
    </div>

    <div class="panel">
      <h2>오늘 메모</h2>
      <textarea id="notes" class="notes-area" placeholder="자유롭게 메모하세요..."></textarea>
      <div class="notes-status" id="notesStatus">저장됨</div>
    </div>
  </div>

<script>
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });

  // --- Todo ---
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  const todoStats = document.getElementById('todoStats');
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function renderTodos() {
    todoList.innerHTML = '';
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      if (t.done) li.classList.add('done');
      li.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''}>
        <span class="text"></span>
        <button class="del">×</button>
      `;
      li.querySelector('.text').textContent = t.text;
      li.querySelector('input').addEventListener('change', () => {
        todos[i].done = !todos[i].done;
        saveTodos();
      });
      li.querySelector('.del').addEventListener('click', () => {
        todos.splice(i, 1);
        saveTodos();
      });
      todoList.appendChild(li);
    });
    const done = todos.filter(t => t.done).length;
    todoStats.textContent = `${done} / ${todos.length} 완료`;
  }
  function saveTodos() {
    localStorage.setItem('todos', JSON.stringify(todos));
    renderTodos();
  }
  function addTodo() {
    const v = todoInput.value.trim();
    if (!v) return;
    todos.push({ text: v, done: false });
    todoInput.value = '';
    saveTodos();
  }
  document.getElementById('todoAdd').addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  renderTodos();

  // --- Timer ---
  let timerMinutes = 25;
  let remaining = timerMinutes * 60;
  let intervalId = null;
  let currentMode = 'focus';
  const display = document.getElementById('timerDisplay');
  const startBtn = document.getElementById('timerStart');
  const resetBtn = document.getElementById('timerReset');
  const modeLabel = document.getElementById('timerMode');
  const sessionCountEl = document.getElementById('sessionCount');

  function loadSessions() {
    const data = JSON.parse(localStorage.getItem('sessions') || '{}');
    return data[todayKey()] || 0;
  }
  function incrementSession() {
    const data = JSON.parse(localStorage.getItem('sessions') || '{}');
    data[todayKey()] = (data[todayKey()] || 0) + 1;
    localStorage.setItem('sessions', JSON.stringify(data));
    renderSessions();
  }
  function renderSessions() {
    sessionCountEl.textContent = `오늘 완료한 세션: ${loadSessions()}`;
  }
  renderSessions();

  function updateDisplay() {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.title = `${display.textContent} - Daily Focus`;
  }
  function tick() {
    if (remaining <= 0) {
      clearInterval(intervalId);
      intervalId = null;
      startBtn.textContent = '시작';
      if (currentMode === 'focus') incrementSession();
      try {
        const audio = new AudioContext();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.connect(gain); gain.connect(audio.destination);
        osc.frequency.value = 660;
        gain.gain.setValueAtTime(0.15, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.8);
        osc.start(); osc.stop(audio.currentTime + 0.8);
      } catch(e) {}
      alert(currentMode === 'focus' ? '집중 세션 완료! 잠깐 쉬세요.' : '휴식 끝! 다시 집중해봅시다.');
      return;
    }
    remaining--;
    updateDisplay();
  }
  startBtn.addEventListener('click', () => {
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
      startBtn.textContent = '재개';
    } else {
      intervalId = setInterval(tick, 1000);
      startBtn.textContent = '일시정지';
    }
  });
  resetBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    intervalId = null;
    remaining = timerMinutes * 60;
    startBtn.textContent = '시작';
    updateDisplay();
  });
  document.querySelectorAll('.mode-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      timerMinutes = parseInt(btn.dataset.time, 10);
      modeLabel.textContent = currentMode === 'focus' ? 'Focus' : (currentMode === 'short' ? 'Short Break' : 'Long Break');
      clearInterval(intervalId);
      intervalId = null;
      remaining = timerMinutes * 60;
      startBtn.textContent = '시작';
      updateDisplay();
    });
  });
  updateDisplay();

  // --- Notes ---
  const notes = document.getElementById('notes');
  const notesStatus = document.getElementById('notesStatus');
  const notesKey = `notes-${todayKey()}`;
  notes.value = localStorage.getItem(notesKey) || '';
  let saveTimeout = null;
  notes.addEventListener('input', () => {
    notesStatus.textContent = '입력 중...';
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      localStorage.setItem(notesKey, notes.value);
      notesStatus.textContent = `저장됨 · ${new Date().toLocaleTimeString('ko-KR')}`;
    }, 400);
  });

  // --- Service Worker (offline support) ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
